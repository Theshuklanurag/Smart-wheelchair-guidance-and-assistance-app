<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help & Support</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f7fdf6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .form-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.5s ease-out;
        }
        .home-button {
            position: absolute; top: 25px; left: 25px; font-size: 1.5rem;
            color: #aaa; text-decoration: none; transition: color 0.3s;
        }
        .home-button:hover { color: #4CAF50; }
        h2 {
            margin-bottom: 30px; color: #4CAF50;
            font-weight: 600; font-size: 2rem;
        }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        input, textarea {
            width: 100%; padding: 12px 15px; border-radius: 8px;
            border: 1px solid #ccc; box-sizing: border-box;
            transition: all 0.3s; font-family: 'Poppins', sans-serif;
        }
        input:focus, textarea:focus {
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
            outline: none;
        }
        textarea { resize: vertical; min-height: 120px; }
        button {
            width: 100%; padding: 15px;
            background: linear-gradient(90deg, #4CAF50, #388E3C);
            color: white; border: none; border-radius: 8px; cursor: pointer;
            font-size: 1.1rem; font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        .notification {
            display: none; background: #dff0d8; color: #3c763d;
            padding: 20px; border-radius: 8px; margin-top: 20px;
            border-left: 5px solid #3c763d; text-align: left;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="form-container">
        <a href="./index.html" class="home-button"><i class="fas fa-arrow-left"></i></a>
        <h2>Submit Your Problem</h2>
        <form onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required placeholder="Enter your full name">
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email address">
            </div>
            <div class="form-group">
                <label for="problem">Describe your problem:</label>
                <textarea id="problem" name="problem" rows="5" required placeholder="Please provide details about the issue..."></textarea>
            </div>
            <button type="submit">Submit</button>
        </form>
        <div id="notification" class="notification">
            <p><strong>Success!</strong> Your problem has been submitted. Our team will get back to you shortly.</p>
        </div>
    </div>
    <script>
        function handleSubmit(event) {
            event.preventDefault();
            const notification = document.getElementById('notification');
            notification.style.display = 'block';
            setTimeout(() => {
                window.location.href = './index.html';
            }, 3000);
        }
    </script>
</body>
</html>
