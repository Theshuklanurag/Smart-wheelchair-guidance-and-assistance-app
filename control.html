<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheelchair Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Poppins:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: url('https://images.unsplash.com/photo-1599691880414-00d34a49185a?q=80&w=2070&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: white;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .overlay {
            background-color: rgba(0, 0, 0, 0.6);
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .dashboard {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }
        .dashboard .brand { font-size: 1.5rem; font-weight: 700; }
        .dashboard button {
            background-color: rgba(76, 175, 80, 0.8);
            color: white; border: none; border-radius: 20px;
            padding: 10px 20px; font-size: 1rem; font-weight: bold;
            cursor: pointer; transition: all 0.3s;
        }
        .dashboard button:hover { background-color: #388E3C; transform: scale(1.05); }
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(20, 20, 20, 0.7);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .speedometer {
            width: 250px; height: 250px;
            border-radius: 50%;
            background: radial-gradient(circle, #333 40%, #222 100%);
            position: relative;
            margin-bottom: 30px;
            border: 5px solid #555;
            box-shadow: 0 0 20px rgba(0,0,0,0.5), inset 0 0 15px rgba(0,0,0,0.7);
        }
        .needle {
            width: 4px; height: 100px; background-color: #ff4136;
            position: absolute; top: 25px; left: calc(50% - 2px);
            transform-origin: bottom; transform: rotate(-90deg);
            transition: transform 0.5s cubic-bezier(0.4, 1.8, 0.5, 0.9);
            border-radius: 2px; box-shadow: 0 0 10px #ff4136;
        }
        .speed-label {
            position: absolute; bottom: 50px; left: 50%;
            transform: translateX(-50%); font-size: 2.5rem;
            font-family: 'Roboto Mono', monospace; font-weight: 700;
        }
        .controls {
            display: grid;
            grid-template-areas: ". up ." "left stop right" ". down .";
            gap: 20px;
        }
        .button {
            width: 80px; height: 80px;
            background: linear-gradient(145deg, #3a3a3a, #2c2c2c);
            color: white; border: none; border-radius: 50%;
            font-size: 2rem; cursor: pointer;
            box-shadow: 5px 5px 10px #1f1f1f, -5px -5px 10px #474747;
            transition: all 0.2s ease-in-out;
        }
        .button:active {
            box-shadow: inset 5px 5px 10px #1f1f1f, inset -5px -5px 10px #474747;
            transform: scale(0.95); font-size: 1.9rem;
        }
        .button.up { grid-area: up; } .button.left { grid-area: left; }
        .button.right { grid-area: right; } .button.down { grid-area: down; }
        .button.stop {
            grid-area: stop; background: linear-gradient(145deg, #e53935, #b71c1c);
            box-shadow: 5px 5px 10px #8c1613, -5px -5px 10px #ff5c57;
        }
        .button.stop:active {
             box-shadow: inset 5px 5px 10px #8c1613, inset -5px -5px 10px #ff5c57;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <div class="dashboard">
            <div class="brand">WHEELAID Control</div>
            <button onclick="window.location.href='./index.html'"><i class="fas fa-home"></i> Home</button>
        </div>
        <main class="main-content">
            <div id="home" class="container">
                <div class="speedometer">
                    <div class="needle" id="needle"></div>
                    <div class="speed-label"><span id="speedDisplay">0</span><small>%</small></div>
                </div>
                <div class="controls">
                    <button class="button up" onclick="sendCommand('forward')"><i class="fas fa-arrow-up"></i></button>
                    <button class="button left" onclick="sendCommand('left')"><i class="fas fa-arrow-left"></i></button>
                    <button class="button stop" onclick="sendCommand('stop')"><i class="fas fa-stop"></i></button>
                    <button class="button right" onclick="sendCommand('right')"><i class="fas fa-arrow-right"></i></button>
                    <button class="button down" onclick="sendCommand('reverse')"><i class="fas fa-arrow-down"></i></button>
                </div>
            </div>
        </main>
    </div>
    <script>
        let currentSpeed = 0;
        const speedStep = 10;
        const maxSpeed = 100;
        function updateSpeedDisplay() {
            const rotation = (currentSpeed / maxSpeed) * 180 - 90;
            document.getElementById('speedDisplay').textContent = currentSpeed;
            document.getElementById('needle').style.transform = `rotate(${rotation}deg)`;
        }
        function sendCommand(command) {
            switch(command) {
                case 'forward': currentSpeed = Math.min(maxSpeed, currentSpeed + speedStep); break;
                case 'reverse': currentSpeed = Math.max(0, currentSpeed - speedStep); break;
                case 'stop': currentSpeed = 0; break;
            }
            updateSpeedDisplay();
            console.log(`Command: ${command}, Speed: ${currentSpeed}%`);
            // Here you would send the command to your backend/hardware
        }
        updateSpeedDisplay();
    </script>
</body>
</html>
